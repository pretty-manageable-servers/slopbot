name: Test, build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slopbot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: slopbot_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/slopbot_test
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pretty-manageable-servers/slopbot:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/pretty-manageable-servers/slopbot
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to PMServers
        env:
          GH_TOKEN: ${{ github.token }}
          PMS_TOKEN: ${{ secrets.PMS_TOKEN }}
          IMAGE: ghcr.io/pretty-manageable-servers/slopbot:${{ github.sha }}
        run: bash scripts/deployment/ci-deploy.sh

  announce:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post Slopbot deployment changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOPBOT_CHANGELOG_WEBHOOK_URL: ${{ secrets.SLOPBOT_CHANGELOG_WEBHOOK_URL }}
          CHANGELOG_INITIAL_BASE: 3ac2ea9514ef82a57bd887995fab340befea8825
        run: node scripts/deployment/changelog.mjs
