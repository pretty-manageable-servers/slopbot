name: Test, build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slopbot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Needs Postgres and the root build. The light job runs beside it.
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: slopbot_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:node
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/slopbot_test
  # No Postgres and no root build: the deployment script tests, the contracts tests, and the console.
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:light
      - run: pnpm -F slopbot-console test
      - run: pnpm -F slopbot-console build
  # One name for the deploy job to wait on, so it still waits for every test job.
  test:
    needs: [node, light]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all test jobs passed"
  # Builds and pushes the image while the tests run. The image is only tagged with the commit; deploy waits for both.
  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Record build time
        id: build-metadata
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          build-args: |
            SLOPBOT_BUILD_SHA=${{ github.sha }}
            SLOPBOT_BUILD_TIME=${{ steps.build-metadata.outputs.time }}
          push: true
          tags: ghcr.io/pretty-manageable-servers/slopbot:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/pretty-manageable-servers/slopbot
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to PMServers
        env:
          GH_TOKEN: ${{ github.token }}
          PMS_TOKEN: ${{ secrets.PMS_TOKEN }}
          IMAGE: ghcr.io/pretty-manageable-servers/slopbot:${{ github.sha }}
        run: bash scripts/deployment/ci-deploy.sh

  announce:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post Slopbot deployment changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOPBOT_CHANGELOG_WEBHOOK_URL: ${{ secrets.SLOPBOT_CHANGELOG_WEBHOOK_URL }}
          CHANGELOG_INITIAL_BASE: 3ac2ea9514ef82a57bd887995fab340befea8825
        run: node scripts/deployment/changelog.mjs
