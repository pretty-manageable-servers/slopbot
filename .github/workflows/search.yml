name: Build search service
on:
  push:
    branches: [main]
    paths: ['services/search/**', '.github/workflows/search.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: slopbot-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/search
          file: services/search/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pretty-manageable-servers/slopbot-search:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/pretty-manageable-servers/slopbot
          cache-from: type=gha,scope=search
          cache-to: type=gha,mode=max,scope=search
      - name: Update existing search container
        env:
          GH_TOKEN: ${{ github.token }}
          PMS_TOKEN: ${{ secrets.PMS_TOKEN }}
          IMAGE: ghcr.io/pretty-manageable-servers/slopbot-search:${{ github.sha }}
          CONTAINER: slopbot-search
        run: |
          # First-time creation is configured separately with the service's private secret.
          bash scripts/deployment/search-deploy.sh
