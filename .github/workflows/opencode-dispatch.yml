name: opencode-dispatch

# Triggered via workflow_dispatch by the Slopbot GitHub App when an owner
# approves a development job.  The standard opencode.yml (comment-based) is
# left unchanged for manual /oc usage.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or PR number to work on
        required: true
        type: number
      prompt:
        description: The prompt/instruction for OpenCode
        required: true
        type: string
      model:
        description: OpenCode model id
        required: false
        type: string
        default: opencode/mimo-v2.6-flash-free

concurrency:
  group: opencode-dispatch-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Verify dispatch source
        if: ${{ !endsWith(github.actor, '[bot]') }}
        run: |
          echo "::error::This workflow can only be triggered by an authorized Slopbot GitHub App installation. Direct dispatch by users is not permitted."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        with:
          model: ${{ inputs.model }}
          variant: high
          issue_number: ${{ inputs.issue_number }}
          prompt: ${{ inputs.prompt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "$schema": "https://opencode.ai/config.json",
              "permission": "allow"
            }
